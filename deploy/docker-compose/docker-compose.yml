version: "3.8"

# Set mysql, redis, postgresql persistence
volumes:
    mysql:
    redis:
    postgres:

services:
    web:
        build:
            context: ../../web
            dockerfile: ./Dockerfile
        container_name: gva-web
        restart: always
        ports:
            - "127.0.0.1:8080:3040"
        depends_on:
            - server

    server:
        build:
            context: ../../server
            dockerfile: ./Dockerfile
        container_name: gva-server
        restart: always
        ports:
            - "127.0.0.1:8888:8888"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        links:
            - postgres
            - redis
        environment:
            - DB_FALLBACK_ENABLED=true

    mysql:
        image: mysql:8.0
        platform: linux/amd64
        container_name: gva-mysql
        command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        restart: on-failure:3
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "525374187"
            MYSQL_DATABASE: "my_landing_page"
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p525374187",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        volumes:
            - mysql:/var/lib/mysql
            - ./mysql-init:/docker-entrypoint-initdb.d

    redis:
        image: redis:7-alpine
        platform: linux/amd64
        container_name: gva-redis
        restart: always
        ports:
            - "127.0.0.1:6379:6379"
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
        volumes:
            - redis:/data

    postgres:
        image: postgres:15-alpine
        platform: linux/amd64
        container_name: gva-postgres
        restart: always
        ports:
            - "127.0.0.1:4335:5432"
        environment:
            POSTGRES_DB: "new_db"
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "2521"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        volumes:
            - postgres:/var/lib/postgresql/data
